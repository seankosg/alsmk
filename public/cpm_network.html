<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건설공사 CPM 네트워크 공정표</title>
<style>
    :root {
    --bg: #0f1117;
    --surface: #161b27;
    --surface2: #1e2535;
    --border: #2a3347;
    --accent: #e8c547;
    --critical: #ff4d4d;
    --safe: #4da6ff;
    --text: #e2e8f0;
    --text-dim: #7a8ba0;
    --green: #3dd68c;
    --mono: 'Consolas', 'D2Coding', 'Courier New', monospace;
    --sans: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR',
            'Nanum Gothic', '맑은 고딕', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    min-height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .logo span { color: var(--text-dim); font-weight: 400; }
  .header-tabs { display: flex; gap: 0; }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    padding: 0 18px; height: 56px;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* ── Layout ── */
  .app {
    display: flex;
    flex: 1;
    min-height: 0;   /* flex 자식이 overflow scroll 되도록 */
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 380px; min-width: 320px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .sidebar-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-title { font-size: 12px; font-weight: 600; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }
  .btn-add {
    background: var(--accent); color: #000;
    border: none; border-radius: 4px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: var(--sans);
    transition: opacity .15s;
  }
  .btn-add:hover { opacity: .85; }

  .activity-list {
    flex: 1; overflow-y: auto;
    padding: 8px;
  }
  .activity-list::-webkit-scrollbar { width: 4px; }
  .activity-list::-webkit-scrollbar-track { background: transparent; }
  .activity-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .activity-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 6px;
    position: relative;
    transition: border-color .15s;
  }
  .activity-card.critical { border-left: 3px solid var(--critical); }
  .activity-card:hover { border-color: #3d4f6e; }
  .activity-card.selected { border-color: var(--accent); background: rgba(232,197,71,.08); }

  .card-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .act-id {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    background: var(--border); color: var(--accent);
    padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  }
  .act-name-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: default;
  }
  .btn-del {
    display: none;
  }
  .field-input[readonly] {
    cursor: default; opacity: 0.8; pointer-events: none;
  }

  .card-row2 { display: flex; gap: 8px; }
  .field-group { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .field-label { font-size: 10px; color: var(--text-dim); letter-spacing: .05em; }
  .field-input {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px;
    color: var(--text); font-family: var(--mono); font-size: 12px;
    outline: none; width: 100%;
    transition: border-color .15s;
  }
  .field-input:focus { border-color: var(--accent); }

  .cpm-badge {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px;
  }
  .badge {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 6px; border-radius: 2px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .badge.tf0 { color: var(--critical); border-color: var(--critical); }
  .badge.float { color: var(--green); }

  .btn-save { flex:1; background:var(--accent); color:#000; border:none; border-radius:5px;
    padding:8px; font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; }
  .btn-save:hover { opacity:.85; }
  .btn-danger { background:none; border:1px solid var(--border); color:var(--critical);
    border-radius:5px; padding:8px 14px; font-family:var(--sans); font-size:12px; cursor:pointer; }
  .btn-danger:hover { border-color:var(--critical); background:rgba(255,77,77,.08); }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .btn-calc {
    flex: 1; background: var(--accent); color: #000;
    border: none; border-radius: 5px;
    padding: 9px; font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  .btn-calc:hover { opacity: .85; }
  .footer-row { display: flex; gap: 8px; }
  .btn-sample {
    flex: 1; background: var(--surface2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 9px 14px; font-family: var(--sans); font-size: 12px;
    cursor: pointer; transition: all .15s; text-align: center;
  }
  .btn-sample:hover { color: var(--text); border-color: #3d4f6e; }

  /* XML Upload Zone */
  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: rgba(232,197,71,.05); }
  .upload-zone input[type=file] { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
  .upload-label { font-size: 11px; color: var(--text-dim); pointer-events: none; }
  .upload-label span { color: var(--accent); font-weight: 600; }

  /* ── Main Panel ── */
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .panel { display: none; flex: 1; min-height: 0; overflow: hidden; }
  .panel.active { display: flex; flex-direction: column; }

  /* Network Canvas */
  #networkPanel { position: relative; }
  #networkCanvas {
    flex: 1;
    overflow: auto;
    background:
      radial-gradient(circle at 20% 50%, rgba(232,197,71,.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(77,166,255,.03) 0%, transparent 40%),
      var(--bg);
  }
  #networkCanvas::-webkit-scrollbar { width: 14px; height: 14px; }
  #networkCanvas::-webkit-scrollbar-track { background: var(--bg); }
  #networkCanvas::-webkit-scrollbar-thumb { background: var(--border); border-radius: 7px; }
  #networkCanvas::-webkit-scrollbar-thumb:hover { background: #5a7a9a; }

  #svgContainer {
    min-width: 100%; min-height: 100%;
    padding: 40px;
  }

  .legend {
    position: absolute; bottom: 16px; right: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px;
    display: flex; gap: 16px; align-items: center;
    font-size: 11px; color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* Node SVG styles */
  .node-box { rx: 6; ry: 6; }

  /* Gantt */
  #ganttPanel { overflow: auto; padding: 24px; }
  #ganttPanel::-webkit-scrollbar { width: 6px; height: 6px; }
  #ganttPanel::-webkit-scrollbar-track { background: var(--bg); }
  #ganttPanel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .gantt-wrap { min-width: 900px; }
  .gantt-header {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  table.gantt {
    width: 100%; border-collapse: collapse;
    font-size: 12px;
  }
  table.gantt th {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 7px 10px;
    font-weight: 600; color: var(--text-dim);
    font-family: var(--mono); font-size: 11px;
    text-align: center;
  }
  table.gantt td {
    border: 1px solid var(--border);
    padding: 5px 10px;
    vertical-align: middle;
  }
  table.gantt tr:hover td { background: rgba(255,255,255,.02); }
  .gantt-bar-cell { padding: 4px 6px; }
  .gantt-bar-outer {
    background: var(--surface2);
    border-radius: 3px; height: 18px;
    position: relative; overflow: visible;
  }
  .gantt-bar-fill {
    height: 100%; border-radius: 3px;
    background: var(--safe);
    position: absolute; top: 0;
  }
  .gantt-bar-fill.critical { background: var(--critical); }
  .gantt-bar-progress {
    height: 100%; border-radius: 3px;
    background: var(--green);
    position: absolute; top: 0;
    opacity: .7;
  }
  .gantt-float-bar {
    height: 100%; border-radius: 3px;
    background: rgba(61,214,140,.25);
    border: 1px dashed var(--green);
    position: absolute; top: 0;
  }
  .critical-tag {
    font-family: var(--mono); font-size: 10px;
    color: var(--critical); font-weight: 600;
  }

  /* WBS Panel */
  #wbsPanel { overflow: auto; padding: 24px; }
  .wbs-tree { font-size: 13px; }
  .wbs-node {
    padding: 7px 12px 7px 0;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    transition: background .2s, border-left .2s;
  }
  .wbs-highlight {
    background: rgba(232,197,71,.18) !important;
    border-left: 3px solid var(--accent) !important;
    animation: wbs-pulse .5s ease 2;
  }
  .wbs-highlight-path {
    background: rgba(232,197,71,.07) !important;
    border-left: 2px solid rgba(232,197,71,.4) !important;
  }
  @keyframes wbs-pulse {
    0%,100% { background: rgba(232,197,71,.18); }
    50%      { background: rgba(232,197,71,.35); }
  }
  .wbs-indent { display: inline-block; }
  .wbs-label { font-weight: 500; }
  .wbs-meta { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-left: auto; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text-dim);
  }
  .empty-icon { font-size: 48px; opacity: .3; }
  .empty-text { font-size: 14px; }

  /* Toast */
  /* ── Node Tooltip ── */
  #nodeTooltip {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transform: scale(.92);
    transition: opacity .15s, transform .15s;
    width: 240px;
  }
  #nodeTooltip.visible {
    opacity: 1;
    transform: scale(1);
  }
  .nt-card {
    background: #1a2235;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07);
  }
  .nt-top {
    padding: 10px 14px 8px;
    border-bottom: 1px solid #2a3347;
  }
  .nt-id-row {
    display: flex; align-items: center; gap: 7px; margin-bottom: 5px;
  }
  .nt-id {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 3px;
  }
  .nt-wbs {
    font-family: var(--mono); font-size: 10px; color: #5a7a9a;
  }
  .nt-name {
    font-size: 14px; font-weight: 600; color: #e2e8f0;
    line-height: 1.3; word-break: keep-all;
  }
  .nt-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: #2a3347;
  }
  .nt-cell {
    background: #161b27;
    padding: 8px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .nt-cell-label {
    font-size: 9px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #5a7a9a;
  }
  .nt-cell-val {
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: #e2e8f0;
  }
  .nt-footer {
    padding: 7px 14px;
    font-family: var(--mono); font-size: 10px;
    color: #5a7a9a; display: flex; justify-content: space-between;
    align-items: center;
  }
  .nt-cp-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 3px;
  }


  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 20px;
    font-size: 13px; color: var(--text);
    z-index: 999; opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">CPM<span> / </span>NETWORK SCHEDULER</div>
  <div class="header-tabs">
    <button class="tab-btn active" onclick="switchTab('network',event)">네트워크 다이어그램</button>
    <button class="tab-btn" onclick="switchTab('gantt',event)">간트차트</button>
    <button class="tab-btn" onclick="switchTab('wbs',event)">WBS</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-dim)">
      <div id="autoCalcToggle" onclick="toggleAutoCalc()"
        style="width:32px;height:18px;border-radius:9px;background:var(--border);
               position:relative;cursor:pointer;transition:background .2s;flex-shrink:0">
        <div id="autoCalcThumb"
          style="position:absolute;top:2px;left:2px;width:14px;height:14px;
                 border-radius:50%;background:#fff;transition:transform .2s"></div>
      </div>
      자동계산
    </label>
  </div>
</header>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Activity 목록</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;color:var(--text-dim)">착공일</span>
        <input type="date" id="projectStartInput"
          style="background:var(--bg);border:1px solid var(--border);border-radius:4px;
                 padding:3px 6px;color:var(--text);font-size:11px;font-family:var(--mono);cursor:pointer"
          onchange="window._projectStartDate = this.value ? new Date(this.value) : null">
      </div>
      <button class="btn-add" onclick="addActivity()" style="display:none">+ 추가</button>
    </div>
    <div class="activity-list" id="activityList"></div>
    <div class="sidebar-footer">
      <div class="upload-zone" id="uploadZone"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="handleDrop(event)">
        <input type="file" accept=".xml" onchange="handleFile(this.files[0])">
        <div class="upload-label">📂 <span>MS Project XML</span> 업로드<br>(.xml 드래그 또는 클릭)</div>
      </div>
      <button class="btn-calc" onclick="calculate()">▶ CPM 계산 &amp; 생성</button>
      <div class="footer-row">
        <button class="btn-sample" onclick="loadSample()">공정 초기화</button>
        <button class="btn-sample" onclick="clearAll()">전체 초기화</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Network -->
    <div class="panel active" id="networkPanel">
      <div id="networkCanvas">
        <div id="svgContainer">
          <div class="empty-state" id="emptyNetwork">
            <div class="empty-icon">⬡</div>
            <div class="empty-text">Activity를 입력하고 CPM 계산을 실행하세요</div>
          </div>
        </div>
      </div>
      <div class="legend" id="legend" style="display:none">
        <div class="legend-item"><div class="legend-dot" style="background:var(--critical)"></div>Critical Path</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--safe)"></div>일반 공정</div>
        <div class="legend-item"><div class="legend-dot" style="background:#c97a10"></div>CP 통과 노드 (타 WBS)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green);opacity:.5"></div>Float</div>
        <div class="legend-item" id="filterLabel" style="display:none;color:var(--accent);font-weight:600"><span id="filterText"></span><span onclick="clearWbsFilter()" style="cursor:pointer;margin-left:6px;color:#ff6b6b;font-size:14px" title="필터 해제">✕</span></div>
      </div>
    </div>

    <!-- Gantt -->
    <div class="panel" id="ganttPanel">
      <div class="gantt-wrap" id="ganttContent">
        <div class="empty-state"><div class="empty-icon">📅</div><div class="empty-text">CPM 계산 후 간트차트가 표시됩니다</div></div>
      </div>
    </div>

    <!-- WBS -->
    <div class="panel" id="wbsPanel">
      <div id="wbsContent">
        <div class="empty-state"><div class="empty-icon">🌲</div><div class="empty-text">CPM 계산 후 WBS가 표시됩니다</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<div id="nodeTooltip">
  <div class="nt-card" id="ntCard"></div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────
let activities = [];
let idCounter = 1;
let calculated = false;
window._readOnly = false;

// ─── Activity CRUD ────────────────────────────────────────────────
function genId() { return 'A' + String(idCounter++).padStart(2,'0'); }

function addActivity(data) {
  const id = data ? data.id : genId();
  const act = {
    id,
    name:         data?.name         || '',
    duration:     data?.duration     ?? 3,
    predecessors: data?.predecessors || '',
    wbs:          data?.wbs          || '1',
    wbsFull:      data?.wbsFull      || data?.wbs || '1',
    mppTaskId:    data?.mppTaskId    || null,
    progress:     data?.progress     ?? null,
    es: null, ef: null, ls: null, lf: null, tf: null,
    isCritical: false
  };
  activities.push(act);
  renderSidebar();
  return act;
}

function removeActivity(id) {
  activities = activities.filter(a => a.id !== id);
  renderSidebar();
  scheduleAutoCalc();
}

function syncFromDOM() {
  activities.forEach(a => {
    const nameEl = document.getElementById('name_' + a.id);
    const durEl  = document.getElementById('dur_'  + a.id);
    const predEl = document.getElementById('pred_' + a.id);
    const wbsEl  = document.getElementById('wbs_'  + a.id);
    if (nameEl) a.name         = nameEl.value;
    if (durEl)  a.duration     = parseInt(durEl.value) || 1;
    if (predEl) a.predecessors = predEl.value || '';
    if (wbsEl)  { a.wbs = wbsEl.value; a.wbsFull = wbsEl.value; }
  });
}

function renderSidebar() {
  const list = document.getElementById('activityList');
  list.innerHTML = '';
  activities.forEach(a => {
    const card = document.createElement('div');
    card.className = 'activity-card' + (a.isCritical ? ' critical' : '');
    card.setAttribute('data-act-id', a.id);
    card.style.cursor = 'pointer';
    card.onclick = function(e) {
      if (e.target.tagName === 'BUTTON') return;
      if (e.target.tagName === 'INPUT' && !e.target.readOnly) return;
      handleSidebarCardClick(a.id);
    };
    card.innerHTML = `
      <div class="card-row1">
        <span class="act-id" title="내부ID: ${a.id}">${a.mppTaskId ? '#'+a.mppTaskId : a.id}</span>
        ${a.wbsFull ? `<span style="font-family:var(--mono);font-size:10px;color:#5a7a9a;padding:2px 5px;background:var(--bg);border-radius:3px">${a.wbsFull}</span>` : ''}
        ${(() => { const cf = a.customFields; const bv = cf && (cf.BLDG || cf.Text2 || cf['텍스트2']); return bv ? `<span style="font-family:var(--mono);font-size:10px;color:#c97a10;padding:2px 5px;background:rgba(201,122,16,0.1);border-radius:3px;border:1px solid rgba(201,122,16,0.3)">${bv}</span>` : ''; })()}
        <input class="act-name-input" id="name_${a.id}" placeholder="작업명 입력" value="${(a.name||'').replace(/"/g,'&quot;')}"
          readonly>
        <button class="btn-del" onclick="removeActivity('${a.id}')" ${window._readOnly ? 'style="display:none"' : ''}>×</button>
      </div>
      <div class="card-row2">
        <div class="field-group">
          <span class="field-label">기간(일)</span>
          <input class="field-input" id="dur_${a.id}" type="number" min="1" value="${a.duration}" style="text-align:center"
            readonly>
        </div>
        <div class="field-group" style="flex:2">
          <span class="field-label">선행작업</span>
          <input class="field-input" id="pred_${a.id}" placeholder="-"
            value="${(a.predecessors||'')}"
            readonly>
        </div>
        <div class="field-group" style="flex:2">
          <span class="field-label">후행작업</span>
          <input class="field-input" id="succ_${a.id}" placeholder="-"
            value="${(a.successors||[]).join(', ')}"
            readonly>
        </div>
        <div class="field-group" style="flex:.8">
          <span class="field-label">WBS</span>
          <input class="field-input" id="wbs_${a.id}" placeholder="1.1" value="${a.wbsFull||a.wbs||''}" readonly>
        </div>
      </div>
      ${a.es !== null ? `
      <div class="cpm-badge">
        <span class="badge">ES:${a.es}</span>
        <span class="badge">EF:${a.ef}</span>
        <span class="badge">LS:${a.ls}</span>
        <span class="badge">LF:${a.lf}</span>
        <span class="badge ${a.tf===0?'tf0':'float'}">TF:${a.tf}</span>
        ${a.isCritical ? '<span class="badge tf0">★ CRITICAL</span>' : ''}
      </div>` : ''}
    `;
    list.appendChild(card);
  });
}

// ─── CPM Engine ───────────────────────────────────────────────────

// ─── addWorkDays utility ─────────────────────────────────────────
function addWorkDays(startDate, days) {
  const d = new Date(startDate);
  d.setDate(d.getDate() + days);
  return d;
}

// ─── XSS escape utility ─────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function calculate(forceReadOnly) {
  if (window._readOnly && !forceReadOnly) return;
  if (activities.length === 0) { showToast('Activity를 먼저 추가하세요'); return; }

  const map = {};
  activities.forEach(a => {
    map[a.id] = a;
    a.es=0; a.ef=0; a.ls=0; a.lf=0; a.tf=0; a.isCritical=false;
    a.successors = [];
  });

  // ── 선행작업 링크 파싱 ──────────────────────────────────────────
  // predLinks: "A01:1:0,A02:0:2" 형식 (id:linkType:lagDays)
  // predecessors: 단순 id 목록 (수동 입력용)
  // linkType: 1=FS, 0=FF, 3=SS, 2=SF
  const predLinkMap = {};  // actId → [{id, type, lag}]
  activities.forEach(a => {
    const links = [];
    // predLinks와 predecessors 모두 동일한 파서로 처리
    // 지원 포맷: "A01" (FS 기본), "A01:SS:2" (타입:Lag), "A01:FF", "A01::3"
    const rawStr = (a.predLinks && a.predLinks.trim())
      ? a.predLinks          // XML 업로드: predLinks 우선
      : (a.predecessors||''); // 수동 입력: predecessors

    rawStr.split(',').forEach(token => {
      const parts = token.trim().split(':');
      const pid  = parts[0].trim();
      if (!pid) return;
      const lt   = parts[1] ? parts[1].trim().toUpperCase() : 'FS';
      const lag  = parseInt(parts[2]||'0') || 0;
      // 링크 타입 정규화: FS=1, FF=0, SS=3, SF=2
      const typeMap = {'FS':'1','FF':'0','SS':'3','SF':'2','1':'1','0':'0','3':'3','2':'2'};
      const linkType = typeMap[lt] || '1';
      if (map[pid]) {
        links.push({id:pid, type:linkType, lag:lag});
      } else if (pid) {
        // 존재하지 않는 ID: 경고 수집 (Silent Failure 방지)
        if (!window._invalidPreds) window._invalidPreds = [];
        window._invalidPreds.push(`${a.id}→${pid}`);
      }
    });
    predLinkMap[a.id] = links;
    // successor 구성
    links.forEach(p => { if(map[p.id]) map[p.id].successors.push(a.id); });
  });

  // ── 날짜 기반 여부 판단 ──────────────────────────────────────────
  const hasRealDates = activities.some(a => a.startDate && a.finishDate);

  // ── Topological Sort (Kahn's) ────────────────────────────────────
  const inDeg = {};
  activities.forEach(a => { inDeg[a.id] = 0; });
  activities.forEach(a => {
    predLinkMap[a.id].forEach(p => { if(map[p.id]) inDeg[a.id]++; });
  });
  const queue = activities.filter(a => inDeg[a.id]===0).map(a=>a.id);
  const order = [];
  while (queue.length) {
    const cur = queue.shift(); order.push(cur);
    map[cur].successors.forEach(sid => { inDeg[sid]--; if(inDeg[sid]===0) queue.push(sid); });
  }
  if (order.length !== activities.length) {
    // 순환에 포함된 Task 식별
    const inOrder = new Set(order);
    const cycleActs = activities.filter(a => !inOrder.has(a.id));
    const cycleNames = cycleActs.slice(0,5).map(a => `${a.mppTaskId?'#'+a.mppTaskId:a.id} ${a.name||''}`).join(', ');
    showToast(`❌ 순환 의존성 감지 — 확인 필요: ${cycleNames}${cycleActs.length>5?` 외 ${cycleActs.length-5}개`:''}`);
    // 순환 Task 카드 시각적 표시
    cycleActs.forEach(a => {
      const card = document.querySelector(`[id="name_${a.id}"]`)?.closest('.activity-card');
      if (card) { card.style.borderColor='#ff4d4d'; card.style.borderWidth='2px'; }
    });
    return;
  }
  // 유효하지 않은 선행작업 경고
  if (window._invalidPreds && window._invalidPreds.length) {
    showToast(`⚠ 존재하지 않는 선행작업 무시됨: ${window._invalidPreds.slice(0,3).join(', ')}`);
    window._invalidPreds = [];
  }

  let projectEnd;

  if (hasRealDates) {
    // ── 날짜 기반 CPM (FS/FF/SS + Constraint 완전 반영) ─────────────
    const allStarts = activities.map(a=>a.startDate).filter(Boolean);
    const projStart = new Date(Math.min(...allStarts.map(d=>d.getTime())));
    window._projStart = projStart;
    const toDay = d => Math.round((d.getTime()-projStart.getTime())/86400000);

    // 원본 날짜 기반 초기 ES/EF
    activities.forEach(a => {
      if (a.startDate) {
        a.es = toDay(a.startDate);
        a.ef = a.finishDate ? toDay(a.finishDate) : a.es;
        a.duration = Math.max(0, a.ef - a.es);
      } else {
        a.es = 0; a.ef = a.duration;
      }
    });

    // Forward pass (링크 타입 + Constraint)
    order.forEach(id => {
      const a = map[id];
      const links = predLinkMap[id];
      if (links.length > 0) {
        let es_min = 0;
        links.forEach(p => {
          const pa = map[p.id]; if(!pa) return;
          const lag = p.lag || 0;
          let cand;
          if      (p.type==='1') cand = pa.ef + lag;           // FS
          else if (p.type==='0') cand = pa.ef + lag - a.duration; // FF
          else if (p.type==='3') cand = pa.es + lag;           // SS
          else if (p.type==='2') cand = pa.es + lag - a.duration; // SF
          else                   cand = pa.ef + lag;
          es_min = Math.max(es_min, cand);
        });
        // MSO (Must Start On = constraintType 4): 날짜 고정
        if (a.constraintType==='4' && a.constraintDate) {
          a.es = toDay(a.constraintDate);
        } else {
          a.es = Math.max(a.es, es_min);
        }
      } else {
        // 선행 없는 경우도 MSO 적용
        if (a.constraintType==='4' && a.constraintDate) {
          a.es = toDay(a.constraintDate);
        }
      }
      a.ef = a.es + a.duration;
    });

    projectEnd = Math.max(...activities.map(a=>a.ef));

    // Backward pass 초기화
    activities.forEach(a => { a.lf = projectEnd; a.ls = projectEnd - a.duration; });

    // Backward pass (링크 타입 반영)
    [...order].reverse().forEach(id => {
      const a = map[id];
      if (a.successors.length === 0) {
        a.lf = projectEnd;
      } else {
        const lf_cands = [];
        a.successors.forEach(sid => {
          const sa = map[sid];
          predLinkMap[sid].forEach(p => {
            if (p.id !== id) return;
            const lag = p.lag||0;
            if      (p.type==='1') lf_cands.push(sa.ls - lag);   // FS
            else if (p.type==='0') lf_cands.push(sa.lf - lag);   // FF
            else if (p.type==='3') lf_cands.push(sa.ls - lag);   // SS
            else if (p.type==='2') lf_cands.push(sa.lf - lag);   // SF
            else                   lf_cands.push(sa.ls - lag);
          });
        });
        a.lf = lf_cands.length ? Math.min(...lf_cands) : projectEnd;
      }
      // MSO: ls도 고정
      if (a.constraintType==='4' && a.constraintDate) {
        const msoDay = toDay(a.constraintDate);
        a.ls = msoDay;
        a.lf = msoDay + a.duration;
      } else {
        a.ls = a.lf - a.duration;
      }
      a.tf = a.ls - a.es;
      a.isCritical = a.tf === 0;
    });

    // 날짜 역산 (ES/EF → Date)
    activities.forEach(a => {
      if (!a.startDate) {
        const d = new Date(projStart); d.setDate(d.getDate()+a.es);
        a.startDate = d;
      }
      if (!a.finishDate) {
        const d = new Date(projStart); d.setDate(d.getDate()+a.ef);
        a.finishDate = d;
      }
    });

  } else {
    // ── 상대 공기 기반 CPM (수동 입력, FS만) ───────────────────────
    order.forEach(id => {
      const a = map[id];
      const links = predLinkMap[id];
      if (links.length) {
        const esCands = links.map(p => {
          const pred = map[p.id];
          if (!pred) return 0;
          const lag = p.lag || 0;
          if      (p.type==='1') return pred.ef + lag;  // FS
          else if (p.type==='0') return pred.ef + lag - a.duration; // FF
          else if (p.type==='3') return pred.es + lag;  // SS
          else if (p.type==='2') return pred.es + lag - a.duration; // SF
          else                   return pred.ef + lag;  // default FS
        });
        a.es = Math.max(0, ...esCands);
      } else {
        a.es = 0;
      }
      a.ef = a.es + a.duration;
    });
    projectEnd = Math.max(...activities.map(a=>a.ef));
    activities.forEach(a => { a.lf=projectEnd; a.ls=projectEnd-a.duration; });
    [...order].reverse().forEach(id => {
      const a = map[id];
      if (a.successors.length === 0) {
        a.lf = projectEnd;
      } else {
        const lfCands = [];
        a.successors.forEach(sid => {
          const sa = map[sid];
          predLinkMap[sid].forEach(p => {
            if (p.id !== id) return;
            const lag = p.lag || 0;
            if      (p.type==='1') lfCands.push(sa.ls - lag);           // FS
            else if (p.type==='0') lfCands.push(sa.lf - lag);           // FF
            else if (p.type==='3') lfCands.push(sa.ls - lag + a.duration); // SS
            else if (p.type==='2') lfCands.push(sa.lf - lag);           // SF
            else                   lfCands.push(sa.ls - lag);
          });
        });
        a.lf = lfCands.length ? Math.min(...lfCands) : projectEnd;
      }
      a.ls = a.lf - a.duration;
      a.tf = a.ls - a.es;
      a.isCritical = a.tf===0;
    });
    if (window._projectStartDate) {
      const ps = window._projectStartDate;
      activities.forEach(a => {
        a.startDate  = addWorkDays(ps, a.es);
        a.finishDate = addWorkDays(ps, a.ef);
      });
    }
  }

  // mppCritical 조건부 적용:
  // - mppCritical 필드가 있는 Activity(XML 업로드) → 원본 MS Project CP 우선
  // - mppCritical 없는 Activity(수동 추가) → CPM 계산 결과(tf===0) 그대로 유지
  activities.forEach(a => {
    if (a.mppCritical !== undefined && a.mppCritical !== null) {
      // XML 업로드 Activity: 원본 MPP 기준
      a.isCritical = a.mppCritical === true;
      if (a.mppTF !== null && a.mppTF !== undefined) a.tf = a.mppTF;
      if (a.mppES) {
        const p = window._projStart;
        if (p) {
          a.es = Math.round((a.mppES-p)/86400000);
          a.ef = Math.round((a.mppEF-p)/86400000);
          a.ls = Math.round((a.mppLS-p)/86400000);
          a.lf = Math.round((a.mppLF-p)/86400000);
        }
      }
    }
    // mppCritical 없는 수동 추가 Activity: CPM 계산 결과 유지 (isCritical=tf===0)
  });
  const cpCount = activities.filter(a=>a.isCritical).length;
  calculated = true;
  renderSidebar();
  drawNetwork(order, map, projectEnd, window._activeWbsFilter || null);
  renderGantt(order, map, projectEnd);
  renderWBS(order, map);
  document.getElementById('legend').style.display = 'flex';
  const mode = hasRealDates ? '날짜 기반' : '상대 공기';
  showToast(`✓ CPM 완료 (${mode}) — 총 공기: ${projectEnd}일 | CP: ${cpCount}개`);
  // 계산 결과 localStorage 저장
  saveToStorage();
  // postMessage: 계산 완료 데이터를 부모 React에 전송
  postCpmCalculated();
  // 서버(DB)에도 스냅샷 자동 저장
  postSnapshotSave();
}

// ─── Network Diagram ──────────────────────────────────────────────
let _nodePositions = {};   // module-level: actId → {x, y}
const _NODE_W = 160, _NODE_H = 104;

// filterWbs: null = 전체, Set = 해당 WBS prefix들만
function drawNetwork(order, map, projectEnd, filterWbs) {
  const NODE_W = _NODE_W, NODE_H = _NODE_H, GAP_X = 60, GAP_Y = 50;

  // ── WBS 필터 적용 ──────────────────────────────────────────────
  const hasFilter = filterWbs && filterWbs.size > 0;
  const isInFilter = id => {
    if (!hasFilter) return true;
    const a = map[id];
    const code = a.wbsFull || a.wbs || '';
    for (const fw of filterWbs) {
      if (code === fw || code.startsWith(fw + '.')) return true;
    }
    return false;
  };

  // CP 경로 추적: CP 노드들의 연결 집합
  const cpSet = new Set(order.filter(id => map[id].isCritical));

  // 통과 노드: CP에 속하지만 필터 밖인 노드
  const isPassThrough = id => hasFilter && cpSet.has(id) && !isInFilter(id);

  // 표시 대상 = 필터 내 노드 + 통과 노드
  const visibleSet = new Set(order.filter(id => isInFilter(id) || isPassThrough(id)));

  // filterLabel 업데이트
  const lbl = document.getElementById('filterLabel');
  if (hasFilter) {
    lbl.style.display = 'flex';
    const ft = document.getElementById('filterText');
    if (ft) ft.textContent = `필터: WBS ${[...filterWbs].join(', ')}`;
  } else {
    lbl.style.display = 'none';
  }

  // 표시할 order만 추림
  const visOrder = order.filter(id => visibleSet.has(id));

  // Assign columns (levels) via longest path from start (visible only)
  // predLinks 우선, 없으면 predecessors fallback
  const getPredIds = id => {
    const a = map[id]; if(!a) return [];
    // predLinks: "A01:1:0,A02:0:2" 형식
    if (a.predLinks && a.predLinks.trim()) {
      return a.predLinks.split(',').map(t=>t.split(':')[0].trim()).filter(s=>map[s]&&visibleSet.has(s));
    }
    return (a.predecessors||'').split(',').map(s=>s.trim()).filter(s=>map[s]&&visibleSet.has(s));
  };

  const level = {};
  visOrder.forEach(id => {
    const a = map[id];
    if (!a) { level[id] = 0; return; }
    const preds = getPredIds(id);
    level[id] = preds.length ? Math.max(...preds.map(p => (level[p]??0)+1)) : 0;
  });

  // Assign rows within each column
  const cols = {};
  visOrder.forEach(id => {
    const l = level[id];
    if (!cols[l]) cols[l] = [];
    cols[l].push(id);
  });

  const pos = {};
  Object.keys(cols).sort((a,b)=>a-b).forEach(col => {
    const ids = cols[col];
    ids.forEach((id, row) => {
      pos[id] = {
        x: col * (NODE_W + GAP_X) + 40,
        y: row * (NODE_H + GAP_Y) + 40
      };
    });
  });
  _nodePositions = pos;  // expose for scrollToNode

  const colCount = Object.keys(cols).length;
  const maxRow   = Math.max(...Object.values(cols).map(c=>c.length), 1);
  const svgW = colCount * (NODE_W + GAP_X) + 80;
  const svgH = maxRow  * (NODE_H + GAP_Y) + 80;

  // Build SVG
  let arrows = '';
  let nodes  = '';

  // Draw arrows first — predLinks 우선, fallback predecessors
  visOrder.forEach(id => {
    const a = map[id];
    if (!a) return;
    const predIds = getPredIds(id);
    if (!predIds.length) return;
    predIds.forEach(pid => {
      const src = pos[pid], dst = pos[id];
      if (!src || !dst) return;
      const x1 = src.x + NODE_W, y1 = src.y + NODE_H/2;
      const x2 = dst.x,          y2 = dst.y + NODE_H/2;
      const cx1 = x1 + (x2-x1)*0.5, cx2 = x2 - (x2-x1)*0.5;
      const isCrit = map[pid].isCritical && a.isCritical;
      const color = isCrit ? '#ff4d4d' : '#3d4f6e';
      const strokeW = isCrit ? 2.5 : 1.5;
      const markerId = isCrit ? 'arr-crit' : 'arr-norm';
      arrows += `
        <path d="M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}"
          fill="none" stroke="${color}" stroke-width="${strokeW}"
          marker-end="url(#${markerId})"
          ${isCrit ? 'stroke-dasharray="none"' : 'stroke-dasharray="5,3"'}
          opacity="${isCrit?1:.7}"/>
      `;
    });
  });

  // Draw nodes — visOrder is an array of IDs

  visOrder.forEach(id => {
    const a = map[id];
    if (!a) return;
    const p = pos[id];
    if (!p) return;
    const isC  = a.isCritical;
    const isPT = isPassThrough(id);
    const fill   = isPT ? '#1a1200' : isC ? '#1f1010' : '#131b2a';
    const stroke = isPT ? '#c97a10' : isC ? '#ff4d4d' : '#2a3347';
    const strokeW = (isC || isPT) ? 2 : 1;
    const hColor  = isPT ? '#c97a10' : isC ? '#ff4d4d' : '#4da6ff';
    const nameShort = escHtml((a.name||'').length > 14 ? (a.name||'').slice(0,13)+'…' : (a.name||''));
    const displayId  = a.mppTaskId ? `#${a.mppTaskId}` : id;
    const displayWbs = a.wbsFull || a.wbs || '';

    const ntData = JSON.stringify({
      id: displayId, wbs: displayWbs,
      name: a.name||'', dur: a.duration,
      es: a.es, ef: a.ef, ls: a.ls, lf: a.lf, tf: a.tf,
      isCritical: a.isCritical, isPT: isPT,
      progress: a.progress,
      startDate: a.startDate ? fmtDate(a.startDate) : null,
      finishDate: a.finishDate ? fmtDate(a.finishDate) : null,
      predecessors: a.predecessors||''
    }).replace(/"/g,'&quot;');

    // Progress bar rendering
    const hasProg = a.progress !== null && a.progress !== undefined;
    const progPct = hasProg ? Math.min(100, Math.max(0, a.progress)) : 0;

    // Check for mapped task status data
    const activityStatusKey = `${a.mppTaskId || 'no-mpp'}::${a.wbsFull || a.wbs || 'no-wbs'}::${a.name || ''}`;
    const statusData = window._activityStatusMap && window._activityStatusMap[activityStatusKey];
    const hasStatus = !!statusData;

    // Determine progress values
    const actualPct = hasStatus ? statusData.actualPct : progPct;
    const plannedPct = hasStatus ? statusData.plannedPct : progPct;
    const barW = NODE_W - 16;

    // Status indicator row (task counts)
    let statusRow = '';
    if (hasStatus) {
      const s = statusData;
      statusRow = `
        <text x="10" y="18" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="#7a8ba0">
          <tspan fill="#e2e8f0">●</tspan><tspan fill="#aaa"> ${s.totalTasks}</tspan>
          <tspan dx="4" fill="#3dd68c">●</tspan><tspan fill="#3dd68c"> ${s.onTrack}</tspan>
          <tspan dx="4" fill="#ff4d4d">●</tspan><tspan fill="#ff4d4d"> ${s.delayed}</tspan>
        </text>
      `;
    }

    // Y offsets: push content down by 12 when status row exists
    const yOff = hasStatus ? 12 : 0;

    // Layered progress bar
    let progressBar = '';
    if (hasProg || hasStatus) {
      const barY = NODE_H - 16;
      const plannedW = Math.round(barW * plannedPct / 100);
      const actualW = Math.round(barW * actualPct / 100);
      const progBg = 'rgba(255,255,255,.06)';

      progressBar = `
        <rect x="8" y="${barY}" width="${barW}" height="6" rx="3" fill="${progBg}"/>
        <rect x="8" y="${barY}" width="${plannedW}" height="6" rx="3" fill="#555"/>
      `;

      if (actualPct < plannedPct) {
        // Gap portion in red (from actual to planned)
        progressBar += `<rect x="${8 + actualW}" y="${barY}" width="${Math.max(0, plannedW - actualW)}" height="6" rx="3" fill="#ff4d4d"/>`;
        // Actual in blue
        progressBar += `<rect x="8" y="${barY}" width="${actualW}" height="6" rx="3" fill="#4da6ff"/>`;
      } else {
        // Actual >= planned: blue covers planned
        progressBar += `<rect x="8" y="${barY}" width="${actualW}" height="6" rx="3" fill="#4da6ff"/>`;
      }

      // Label: actual%/planned% for mapped, just pct% for unmapped
      if (hasStatus) {
        progressBar += `<text x="${NODE_W - 8}" y="${barY - 2}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="${actualPct < plannedPct ? '#ff4d4d' : '#4da6ff'}" text-anchor="end" font-weight="600">${actualPct}/${plannedPct}%</text>`;
      } else {
        const progColor = progPct >= 100 ? '#3dd68c' : progPct >= 50 ? '#4da6ff' : progPct > 0 ? '#e8c547' : '#2a3347';
        progressBar += `<text x="${NODE_W - 8}" y="${barY - 2}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="${progColor}" text-anchor="end" font-weight="600">${progPct}%</text>`;
      }
    }

    nodes += `
      <g transform="translate(${p.x},${p.y})" style="cursor:pointer"
        onclick="handleNodeClick(event,'${id}','${displayWbs}')"
        ondblclick="handleNodeDblClick(event,'${id}')"
        onmouseenter="showNodeTooltip(event,'${id}')"
        onmouseleave="hideNodeTooltip()"
        onmousemove="moveNodeTooltip(event)">
        <rect x="3" y="4" width="${NODE_W}" height="${NODE_H}" rx="6" fill="rgba(0,0,0,.4)"/>
        <rect width="${NODE_W}" height="${NODE_H}" rx="6"
          fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"/>
        <rect width="${NODE_W}" height="4" rx="3" fill="${hColor}" opacity=".8"/>
        ${statusRow}
        <text x="8" y="${18 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="9" font-weight="600"
          fill="${hColor}">${displayId}</text>
        <text x="${NODE_W-8}" y="${18 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="9"
          fill="${isC?'#ff8080':'#5a7a9a'}" text-anchor="end">${displayWbs}</text>
        ${(() => { const cf = a.customFields; const bv = cf && (cf.BLDG || cf.Text2 || cf['텍스트2']); return bv ? `<text x="${NODE_W-8}" y="${9 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8"
          fill="#c97a10" text-anchor="end" font-weight="600">${bv}</text>` : ''; })()}
        <text x="${NODE_W/2}" y="${34 + yOff}" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" font-weight="500"
          fill="#e2e8f0" text-anchor="middle">${nameShort}</text>
        <text x="${NODE_W/2}" y="${48 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="10"
          fill="#7a8ba0" text-anchor="middle">${a.duration}일</text>
        <line x1="8" y1="${55 + yOff}" x2="${NODE_W-8}" y2="${55 + yOff}" stroke="#2a3347" stroke-width="1"/>
        ${a.startDate
          ? `<text x="${NODE_W/2}" y="${65 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="#7a8ba0" text-anchor="middle">${fmtDate(a.startDate)} ~</text>
             <text x="${NODE_W/2}" y="${75 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="#7a8ba0" text-anchor="middle">${fmtDate(a.finishDate)}</text>`
          : `<text x="8" y="${67 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="9" fill="#7a8ba0">ES:${a.es} EF:${a.ef}</text>
             <text x="${NODE_W-8}" y="${67 + yOff}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="9" fill="${isC?'#ff6060':'#7a8ba0'}" text-anchor="end">TF:${a.tf}</text>`
        }
        ${progressBar}
        ${isC ? `<text x="${NODE_W/2}" y="${(hasProg || hasStatus) ? NODE_H - 22 : 88}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="#ff4d4d" text-anchor="middle" font-weight="600">★ CRITICAL</text>` : ''}
        ${isPT ? `<text x="${NODE_W/2}" y="${(hasProg || hasStatus) ? NODE_H - 22 : 88}" font-family="'Consolas','D2Coding','Courier New',monospace" font-size="8" fill="#c97a10" text-anchor="middle" font-weight="600">통과 노드</text>` : ''}
      </g>
    `;
  });

  const container = document.getElementById('svgContainer');
  container.innerHTML = `
    <svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg">
      ${arrows}
      ${nodes}
    </svg>
  `;
  document.getElementById('emptyNetwork') && document.getElementById('emptyNetwork').remove();
  // Show empty state if nothing visible
  if (visOrder.length === 0) {
    document.getElementById('svgContainer').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⬡</div><div class="empty-text">해당 WBS에 표시할 Activity가 없습니다</div></div>';
  }
}

// ─── Gantt Chart ──────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '-';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const r = new Date(d); r.setDate(r.getDate()+n); return r;
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function renderGantt(order, map, projectEnd) {
  // Detect if we have real dates (from MS Project XML)
  const hasDates = order.some(id => map[id].startDate);

  let projectStart = null, projectFinish = null, totalDays = projectEnd;

  if (hasDates) {
    // Use actual MS Project dates
    const starts  = order.map(id => map[id].startDate).filter(Boolean);
    const finishes= order.map(id => map[id].finishDate).filter(Boolean);
    projectStart  = new Date(Math.min(...starts.map(d=>d.getTime())));
    projectFinish = new Date(Math.max(...finishes.map(d=>d.getTime())));
    totalDays     = daysBetween(projectStart, projectFinish) || 1;
  }

  const modeLabel = hasDates
    ? `달력 기반 — ${fmtDate(projectStart)} ~ ${fmtDate(projectFinish)} (${totalDays}일)`
    : `CPM 상대 공기 기준 — 총 ${projectEnd}일`;

  const CELL_W = Math.max(14, Math.floor(800 / totalDays));
  const barTotalW = CELL_W * totalDays;

  // Build month header for calendar mode
  let monthHeader = '';
  if (hasDates && totalDays <= 1500) {
    let cur = new Date(projectStart);
    cur.setDate(1);
    while (cur <= projectFinish) {
      const left = Math.max(0, daysBetween(projectStart, cur));
      const label = `${cur.getFullYear()}.${String(cur.getMonth()+1).padStart(2,'0')}`;
      const w = Math.min(CELL_W * 30, barTotalW - left * CELL_W);
      if (w > 0) {
        monthHeader += `<div style="position:absolute;left:${left*CELL_W}px;width:${w}px;
          border-right:1px solid var(--border);padding:2px 4px;
          font-family:var(--mono);font-size:9px;color:var(--text-dim);
          white-space:nowrap;overflow:hidden">${label}</div>`;
      }
      cur.setMonth(cur.getMonth()+1);
    }
  }

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="gantt-header" style="margin:0">간트차트</div>
      <div style="font-family:var(--mono);font-size:11px;color:${hasDates?'var(--accent)':'var(--text-dim)'};
        background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 10px">
        ${hasDates ? '📅 실제 날짜 모드' : '⏱ 상대 공기 모드'}
      </div>
    </div>
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:12px;font-family:var(--mono)">${modeLabel}</div>`;

  html += `<table class="gantt"><thead><tr>
    <th style="width:52px">ID</th>
    <th style="width:170px;text-align:left">작업명</th>
    <th style="width:44px">기간</th>
    <th style="width:44px">진행률</th>
    ${hasDates
      ? `<th style="width:88px">시작일</th><th style="width:88px">완료일</th>`
      : `<th style="width:36px">ES</th><th style="width:36px">EF</th>`}
    <th style="width:36px">LS</th><th style="width:36px">LF</th>
    <th style="width:36px">TF</th>
    <th style="min-width:200px">
      ${hasDates && monthHeader
        ? `<div style="position:relative;height:18px;overflow:hidden">${monthHeader}</div>`
        : '일정 바'}
    </th>
  </tr></thead><tbody>`;

  order.forEach(id => {
    const a = map[id];
    let fillLeftPct, fillWPct, floatLeftPct, floatWPct;
    let startLabel, endLabel;

    if (hasDates && a.startDate && a.finishDate) {
      const taskStart  = daysBetween(projectStart, a.startDate);
      const taskFinish = daysBetween(projectStart, a.finishDate);
      const taskDays   = Math.max(1, taskFinish - taskStart);
      fillLeftPct  = (taskStart  / totalDays * 100).toFixed(2);
      fillWPct     = (taskDays   / totalDays * 100).toFixed(2);
      // Float bar: from finishDate to finishDate + TF days
      const floatDays = a.tf || 0;
      floatLeftPct = (taskFinish / totalDays * 100).toFixed(2);
      floatWPct    = (floatDays  / totalDays * 100).toFixed(2);
      startLabel   = fmtDate(a.startDate);
      endLabel     = fmtDate(a.finishDate);
    } else {
      fillLeftPct  = (a.es / projectEnd * 100).toFixed(2);
      fillWPct     = (Math.max(a.duration, 0.5) / projectEnd * 100).toFixed(2);
      floatLeftPct = (a.ef / projectEnd * 100).toFixed(2);
      floatWPct    = (a.tf  / projectEnd * 100).toFixed(2);
      startLabel   = String(a.es);
      endLabel     = String(a.ef);
    }

    // Today line offset (calendar mode only)
    const todayOffset = hasDates
      ? (daysBetween(projectStart, new Date()) / totalDays * 100).toFixed(2)
      : null;

    html += `<tr>
      <td style="font-family:var(--mono);font-size:11px;color:var(--accent);text-align:center">${a.mppTaskId ? '#'+a.mppTaskId : a.id}</td>
      <td style="font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${escHtml(a.name||'')}">${escHtml(a.name||'(미입력)')}</td>
      <td style="font-family:var(--mono);text-align:center">${a.duration}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;font-weight:600;color:${a.progress!=null?(a.progress>=100?'var(--green)':a.progress>=50?'var(--safe)':'var(--accent)'):'var(--text-dim)'}">${a.progress!=null?a.progress+'%':'-'}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;color:var(--safe)">${startLabel}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;color:var(--safe)">${endLabel}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;color:var(--text-dim)">${a.ls??'-'}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;color:var(--text-dim)">${a.lf??'-'}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;${a.tf===0?'color:var(--critical);font-weight:600':''}">${a.tf??'-'}</td>
      <td class="gantt-bar-cell">
        <div class="gantt-bar-outer" style="width:${barTotalW}px;position:relative">
          <div class="gantt-bar-fill${a.isCritical?' critical':''}"
            style="left:${fillLeftPct}%;width:${fillWPct}%"></div>
          ${a.progress!=null && parseFloat(fillWPct)>0
            ?`<div class="gantt-bar-progress" style="left:${fillLeftPct}%;width:${(parseFloat(fillWPct)*Math.min(100,a.progress)/100).toFixed(2)}%"></div>`:''
          }
          ${(a.tf>0 && parseFloat(floatWPct)>0)
            ?`<div class="gantt-float-bar" style="left:${floatLeftPct}%;width:${floatWPct}%"></div>`:''}
          ${todayOffset!==null && parseFloat(todayOffset)>=0 && parseFloat(todayOffset)<=100
            ?`<div style="position:absolute;top:0;left:${todayOffset}%;width:1.5px;height:100%;background:var(--accent);opacity:.7;z-index:2"></div>`:''}
        </div>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('ganttContent').innerHTML = html;
}

// ─── WBS ──────────────────────────────────────────────────────────
function renderWBS(order, map) {
  // wbsNames: XML에서 수집한 코드→원본이름 맵 (없으면 빈 객체)
  const wbsNames = window._wbsNames || {};

  // wbsFull 기준 자연수 정렬
  const naturalSort = (a, b) => {
    const pa = a.split('.').map(n=>parseInt(n)||0);
    const pb = b.split('.').map(n=>parseInt(n)||0);
    for (let i=0; i<Math.max(pa.length,pb.length); i++) {
      const d=(pa[i]||0)-(pb[i]||0); if(d!==0) return d;
    }
    return 0;
  };

  const sorted = [...order].sort((a,b) =>
    naturalSort(map[a].wbsFull||map[a].wbs||'', map[b].wbsFull||map[b].wbs||'')
  );

  // ── WBS 트리 구조 빌드 ──────────────────────────────────────────
  // tree: { code, name, children:[], activities:[] }
  const root = { code:'', name:'root', children:[], activities:[] };
  const nodeMap = { '': root };

  const getOrCreate = (code) => {
    if (nodeMap[code]) return nodeMap[code];
    const parts  = code.split('.');
    const parent = parts.slice(0,-1).join('.');
    const pNode  = getOrCreate(parent);
    const node   = {
      code,
      name: wbsNames[code] || code,   // 원본 Summary Task 이름 우선
      children: [],
      activities: []
    };
    pNode.children.push(node);
    nodeMap[code] = node;
    return node;
  };

  // 부모 노드 먼저 생성 (OutlineNumber 경로 전체)
  sorted.forEach(id => {
    const a = map[id];
    const full = a.wbsFull || a.wbs || '1';
    // 각 상위 경로 노드 생성
    full.split('.').forEach((_, i, arr) => {
      getOrCreate(arr.slice(0,i+1).join('.'));
    });
    // activity는 자신의 코드 노드에 등록
    nodeMap[full].activities.push(a);
  });

  // 레벨별 색상
  const levelColors = ['#e8c547','#4da6ff','#3dd68c','#c97a10','#bf5af2','#ff7eb3'];
  const levelBg     = ['rgba(232,197,71,.06)','rgba(77,166,255,.04)','rgba(61,214,140,.03)',
                       'rgba(201,122,16,.03)','rgba(191,90,242,.03)','transparent'];

  // ── 재귀 렌더링 ────────────────────────────────────────────────
  function renderNode(node, depth) {
    if (node.code === '') {
      return node.children.map(c => renderNode(c, 0)).join('');
    }

    const color   = levelColors[Math.min(depth, levelColors.length-1)];
    const bg      = levelBg[Math.min(depth, levelBg.length-1)];
    const indent  = depth * 18;
    const allActs = getAllActs(node);
    const totDur  = allActs.reduce((s,a)=>s+a.duration,0);
    const cpCnt   = allActs.filter(a=>a.isCritical).length;
    const hasChildren = node.children.length > 0;

    // WBS 그룹 헤더 (children이 있거나 activities가 없는 경우)
    let html = '';
    if (hasChildren || node.activities.length === 0) {
      html += `<div class="wbs-node" data-wbs="${node.code}" style="cursor:pointer;background:${bg};border-left:2px solid ${color}20"
        onclick="applyWbsFilter('${node.code}')" title="WBS ${node.code} 전체 → 네트워크 필터">
        <span class="wbs-indent" style="width:${indent}px"></span>
        <span style="font-family:var(--mono);font-size:${Math.max(9,11-depth)}px;font-weight:600;
          color:${color};border:1px solid ${color}40;padding:1px 6px;border-radius:3px;
          margin-right:8px;flex-shrink:0">${node.code}</span>
        <span style="font-size:${Math.max(11,13-depth)}px;font-weight:${depth===0?600:500};
          color:var(--text);margin-right:auto">${node.name}</span>
        <span class="wbs-meta" style="flex-shrink:0">${allActs.length}개 | ${totDur}일
          ${cpCnt>0?`| <span style="color:var(--critical)">CP ${cpCnt}</span>`:''}
          <span style="color:${color};margin-left:6px;font-size:10px">▶</span>
        </span>
      </div>`;
      html += node.children.map(c => renderNode(c, depth+1)).join('');
    }

    // Activity 행
    node.activities.forEach(a => {
      const mppRef = a.mppTaskId
        ? `<span style="font-family:var(--mono);font-size:10px;color:#4da6ff;
            background:rgba(77,166,255,.12);padding:1px 5px;border-radius:3px;
            margin-right:5px;flex-shrink:0">#${a.mppTaskId}</span>`
        : '';
      const wbsBadge = `<span style="font-family:var(--mono);font-size:9px;
        color:#5a7a9a;margin-right:6px;flex-shrink:0">${node.code}</span>`;
      const cpBadge = a.isCritical
        ? `<span style="font-family:var(--mono);font-size:9px;
            color:var(--critical);margin-left:4px;flex-shrink:0">★CP</span>` : '';
      const actIndent = (depth + (hasChildren ? 1 : 0)) * 18;
      html += `<div class="wbs-node" data-wbs="${node.code}" data-actid="${a.mppTaskId||a.id}" style="cursor:pointer"
        onclick="applyWbsFilter('${node.code}')"
        title="#${a.mppTaskId||a.id} ${a.name}">
        <span class="wbs-indent" style="width:${actIndent}px"></span>
        ${mppRef}${wbsBadge}
        <span class="wbs-label" style="margin-right:auto;${a.isCritical?'color:var(--critical)':''}">${a.name||'(미입력)'}</span>
        <span class="wbs-meta" style="flex-shrink:0">${a.duration}일
          | ${a.startDate?fmtDate(a.startDate):'ES:'+a.es}
          | TF:${a.tf??'-'}${cpBadge}
        </span>
      </div>`;
    });

    return html;
  }

  function getAllActs(node) {
    return [...node.activities, ...node.children.flatMap(c => getAllActs(c))];
  }

  document.getElementById('wbsContent').innerHTML =
    '<div class="wbs-tree">' + renderNode(root, 0) + '</div>';
}

// ─── WBS Filter (다중 선택) ──────────────────────────────────────
function applyWbsFilter(wbsCode) {
  if (!calculated) { showToast('먼저 CPM 계산을 실행하세요'); return; }
  const map = {};
  activities.forEach(a => { map[a.id] = a; });
  const order = getOrder(map);
  if (!order) return;
  const projectEnd = Math.max(...activities.map(a => a.ef || 0));

  // Set 기반 토글
  if (!window._activeWbsFilter) window._activeWbsFilter = new Set();
  if (window._activeWbsFilter.has(wbsCode)) {
    window._activeWbsFilter.delete(wbsCode);
  } else {
    window._activeWbsFilter.add(wbsCode);
  }

  // Set이 비면 null
  if (window._activeWbsFilter.size === 0) {
    window._activeWbsFilter = null;
    showToast('전체 공정 표시');
  } else {
    showToast(`WBS 필터: ${[...window._activeWbsFilter].join(', ')}`);
  }

  drawNetwork(order, map, projectEnd, window._activeWbsFilter);

  // WBS 탭 하이라이트 업데이트
  document.querySelectorAll('#wbsContent .wbs-node').forEach(el => {
    const wbs = el.getAttribute('data-wbs');
    if (window._activeWbsFilter && window._activeWbsFilter.has(wbs)) {
      el.style.outline = '1px solid var(--accent)';
      el.style.outlineOffset = '-1px';
    } else {
      el.style.outline = '';
      el.style.outlineOffset = '';
    }
  });

  // 네트워크 탭으로 자동 전환
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('networkPanel').classList.add('active');
  document.querySelector('.tab-btn').classList.add('active');
}

function clearWbsFilter() {
  if (!window._activeWbsFilter || window._activeWbsFilter.size === 0) return;
  window._activeWbsFilter = null;
  const map = {};
  activities.forEach(a => { map[a.id] = a; });
  const order = getOrder(map);
  if (!order) return;
  const projectEnd = Math.max(...activities.map(a => a.ef || 0));
  drawNetwork(order, map, projectEnd, null);
  showToast('전체 공정 표시');
}

function getOrder(map) {
  // Build predecessor list from both predecessors field AND predLinks
  const inDeg = {};
  const predOf = {};
  activities.forEach(a => { inDeg[a.id] = 0; predOf[a.id] = new Set(); });
  activities.forEach(a => {
    // From predecessors field
    (a.predecessors||'').split(',').map(s=>s.trim()).filter(s=>map[s])
      .forEach(pid => { predOf[a.id].add(pid); });
    // From predLinks field (XML upload data)
    if (a.predLinks) {
      a.predLinks.split(',').map(s=>s.trim()).filter(Boolean)
        .forEach(link => {
          const pid = link.split(':')[0];
          if (map[pid]) predOf[a.id].add(pid);
        });
    }
  });
  activities.forEach(a => { inDeg[a.id] = predOf[a.id].size; });
  const queue = activities.filter(a => inDeg[a.id]===0).map(a=>a.id);
  const order = [];
  while (queue.length) {
    const cur = queue.shift();
    order.push(cur);
    (map[cur].successors||[]).forEach(sid => {
      if (predOf[sid] && predOf[sid].has(cur)) {
        inDeg[sid]--;
        if (inDeg[sid]===0) queue.push(sid);
      }
    });
  }
  return order;
}

// ─── Node Tooltip ─────────────────────────────────────────────────
let _tooltipTimer = null;

function showNodeTooltip(e, actId) {
  clearTimeout(_tooltipTimer);
  const map = {};
  activities.forEach(a => map[a.id] = a);
  const a = map[actId];
  if (!a) return;

  const isC  = a.isCritical;
  const isPT = !isC && a.tf === 0;  // 간단 판별
  const accentColor = isPT ? '#c97a10' : isC ? '#ff4d4d' : '#4da6ff';
  const predNames = (a.predecessors||'').split(',').map(s=>s.trim()).filter(Boolean)
    .map(pid => { const p = map[pid]; return p ? (p.mppTaskId?'#'+p.mppTaskId:pid)+' '+p.name : pid; })
    .join(', ') || '없음 (시작)';

  const dateRow = a.startDate
    ? `<div class="nt-cell" style="grid-column:1/-1">
         <div class="nt-cell-label">기간</div>
         <div class="nt-cell-val" style="font-size:11px">${fmtDate(a.startDate)} ~ ${fmtDate(a.finishDate)}</div>
       </div>`
    : `<div class="nt-cell"><div class="nt-cell-label">ES</div><div class="nt-cell-val">${a.es??'-'}</div></div>
       <div class="nt-cell"><div class="nt-cell-label">EF</div><div class="nt-cell-val">${a.ef??'-'}</div></div>
       <div class="nt-cell"><div class="nt-cell-label">LS</div><div class="nt-cell-val" style="color:#7a8ba0">${a.ls??'-'}</div></div>
       <div class="nt-cell"><div class="nt-cell-label">LF</div><div class="nt-cell-val" style="color:#7a8ba0">${a.lf??'-'}</div></div>`;

  const tfColor = a.tf===0 ? '#ff4d4d' : '#3dd68c';
  const badge = isC
    ? `<span class="nt-cp-badge" style="background:rgba(255,77,77,.2);color:#ff4d4d">★ CRITICAL PATH</span>`
    : isPT
    ? `<span class="nt-cp-badge" style="background:rgba(201,122,16,.2);color:#c97a10">통과 노드</span>`
    : `<span style="font-size:10px;color:#5a7a9a">TF: <span style="color:${tfColor}">${a.tf??'-'}일</span> 여유</span>`;

  document.getElementById('ntCard').innerHTML = `
    <div class="nt-top">
      <div class="nt-id-row">
        <span class="nt-id" style="background:${accentColor}20;color:${accentColor}">${a.mppTaskId?'#'+a.mppTaskId:actId}</span>
        <span class="nt-wbs">${a.wbsFull||a.wbs||''}</span>
      </div>
      <div class="nt-name">${a.name||'(미입력)'}</div>
    </div>
    <div class="nt-grid">
      <div class="nt-cell">
        <div class="nt-cell-label">기간</div>
        <div class="nt-cell-val">${a.duration}일</div>
      </div>
      <div class="nt-cell">
        <div class="nt-cell-label">TF (여유)</div>
        <div class="nt-cell-val" style="color:${tfColor}">${a.tf??'-'}일</div>
      </div>
      ${dateRow}
    </div>
    <div class="nt-footer">
      <span style="color:#5a7a9a;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        title="${predNames}">선행: ${predNames}</span>
      ${badge}
    </div>
  `;

  const tt = document.getElementById('nodeTooltip');
  tt.classList.add('visible');
  moveNodeTooltip(e);
}

function hideNodeTooltip() {
  _tooltipTimer = setTimeout(() => {
    document.getElementById('nodeTooltip').classList.remove('visible');
  }, 120);
}

function moveNodeTooltip(e) {
  const tt = document.getElementById('nodeTooltip');
  const W = tt.offsetWidth || 240;
  const H = tt.offsetHeight || 200;
  const vw = window.innerWidth, vh = window.innerHeight;
  // 마우스 우측 하단 기본, 경계에서 뒤집기
  let x = e.clientX + 16;
  let y = e.clientY + 16;
  if (x + W > vw - 8) x = e.clientX - W - 16;
  if (y + H > vh - 8) y = e.clientY - H - 16;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}

// ─── Jump to WBS from Network Node ──────────────────────────────
function jumpToWbs(actId, wbsCode) {
  if (!wbsCode) return;

  // 1) WBS 탭으로 전환
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('wbsPanel').classList.add('active');
  document.querySelectorAll('.tab-btn')[2].classList.add('active');

  // 2) 해당 WBS 행 찾아서 스크롤 + 하이라이트
  setTimeout(() => {
    // activity 행 우선, 없으면 WBS 헤더 행
    const actEl  = document.querySelector(`[data-actid="${actId}"]`);
    const wbsEl  = document.querySelector(`[data-wbs="${wbsCode}"]`);
    const target = actEl || wbsEl;
    if (!target) return;

    // 기존 하이라이트 제거
    document.querySelectorAll('.wbs-highlight').forEach(el => {
      el.classList.remove('wbs-highlight');
    });

    // 하이라이트 적용
    target.classList.add('wbs-highlight');

    // 부모 WBS 헤더들도 함께 강조 (경로 추적)
    const parts = wbsCode.split('.');
    for (let i = 1; i < parts.length; i++) {
      const parentCode = parts.slice(0, i).join('.');
      const parentEl = document.querySelector(`[data-wbs="${parentCode}"]`);
      if (parentEl) parentEl.classList.add('wbs-highlight-path');
    }

    // 스크롤
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // 3초 후 하이라이트 페이드 아웃
    setTimeout(() => {
      document.querySelectorAll('.wbs-highlight, .wbs-highlight-path').forEach(el => {
        el.classList.remove('wbs-highlight', 'wbs-highlight-path');
      });
    }, 3000);
  }, 50);
}

// ─── Tab Switch ───────────────────────────────────────────────────
function switchTab(tab, evt) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab+'Panel').classList.add('active');
  if (evt && evt.target) evt.target.classList.add('active');
  else document.querySelector('.tab-btn[onclick*="'+tab+'"]')?.classList.add('active');
}

// ─── XML Upload (MS Project) ──────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
}

function handleFile(file) {
  if (!file || !file.name.endsWith('.xml')) { showToast('⚠ .xml 파일만 지원합니다'); return; }
  const reader = new FileReader();
  reader.onload = (e) => parseMSProjectXML(e.target.result, file.name);
  reader.readAsText(file, 'UTF-8');
}

function parseMSProjectXML(xmlText, fileName) {
  let doc;
  try { doc = new DOMParser().parseFromString(xmlText, 'text/xml'); }
  catch(e) { showToast('❌ XML 파싱 오류'); return; }

  const ns = 'http://schemas.microsoft.com/project';
  const get = (el, tag) => {
    const found = el.getElementsByTagNameNS(ns, tag)[0] || el.getElementsByTagName(tag)[0];
    return found ? found.textContent.trim() : '';
  };

  // ── Parse project-level ExtendedAttributes: FieldID → Alias/FieldName ──
  const fieldIdToName = {};
  // Try multiple approaches to find project-level ExtendedAttributes definitions
  // Approach 1: NS query on root Project element
  const projectEl = doc.getElementsByTagNameNS(ns, 'Project')[0] || doc.getElementsByTagName('Project')[0] || doc.documentElement;
  const extAttrContainers = projectEl.getElementsByTagNameNS(ns, 'ExtendedAttributes');
  let extAttrContainer = null;
  // Get the FIRST ExtendedAttributes that is a direct child of Project (project-level, not task-level)
  for (let i = 0; i < extAttrContainers.length; i++) {
    if (extAttrContainers[i].parentElement === projectEl || extAttrContainers[i].parentNode === projectEl) {
      extAttrContainer = extAttrContainers[i];
      break;
    }
  }
  // Fallback: try without namespace
  if (!extAttrContainer) {
    const nonNsContainers = projectEl.getElementsByTagName('ExtendedAttributes');
    for (let i = 0; i < nonNsContainers.length; i++) {
      if (nonNsContainers[i].parentElement === projectEl || nonNsContainers[i].parentNode === projectEl) {
        extAttrContainer = nonNsContainers[i];
        break;
      }
    }
  }
  if (extAttrContainer) {
    const defs = Array.from(
      extAttrContainer.getElementsByTagNameNS(ns, 'ExtendedAttribute').length
        ? extAttrContainer.getElementsByTagNameNS(ns, 'ExtendedAttribute')
        : extAttrContainer.getElementsByTagName('ExtendedAttribute')
    );
    defs.forEach(ea => {
      const fid = get(ea, 'FieldID');
      const alias = get(ea, 'Alias');
      const fname = get(ea, 'FieldName');
      if (fid) fieldIdToName[fid] = alias || fname || ('Field_' + fid);
    });
  }
  console.log('[CPM XML] ExtendedAttribute field map:', fieldIdToName);

  // Build UID→Task map first
  const tasks = Array.from(doc.getElementsByTagNameNS(ns, 'Task').length
    ? doc.getElementsByTagNameNS(ns, 'Task')
    : doc.getElementsByTagName('Task'));

  const uidMap = {};
  tasks.forEach(t => { uidMap[get(t,'UID')] = t; });

  // ── Summary Task 이름 수집: WBS코드 → 원본 이름 ──
  // 예) '1.2' → '토목공사', '1.2.1' → '터파기'
  window._wbsNames = {};
  tasks.forEach(t => {
    const uid     = get(t,'UID');
    const name    = get(t,'Name');
    const summary = get(t,'Summary');
    const outline = get(t,'OutlineNumber') || get(t,'WBS') || '';
    if (uid==='0' || !name || !outline) return;
    // Summary task와 leaf task 모두 이름 저장 (leaf가 있으면 덮어쓰지 않음)
    if (!window._wbsNames[outline]) window._wbsNames[outline] = name;
  });

  activities = []; idCounter = 1;
  let imported = 0, skipped = 0;

  tasks.forEach(t => {
    const uid  = get(t, 'UID');
    const name = get(t, 'Name');
    const lvl  = parseInt(get(t,'OutlineLevel')||'0');
    const summary = get(t,'Summary');
    const milestone = get(t,'Milestone');

    // Skip project summary (UID=0), summary tasks only (마일스톤은 포함)
    if (uid==='0' || summary==='1' || !name) { skipped++; return; }

    // Milestone 여부
    const isMilestone = milestone === '1';

    // Duration: 마일스톤=0, 일반=달력일(Finish-Start)
    const startStrTmp  = get(t,'Start');
    const finishStrTmp = get(t,'Finish');
    const parseDateTmp = s => { if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; };
    const sdTmp = parseDateTmp(startStrTmp);
    const fdTmp = parseDateTmp(finishStrTmp);
    let dur = 0;
    if (!isMilestone) {
      if (sdTmp && fdTmp) {
        dur = Math.max(1, Math.round((fdTmp - sdTmp) / 86400000));
      } else {
        const durStr = get(t,'Duration');
        const hrMatch = durStr.match(/PT([\d.]+)H/);
        const minMatch = durStr.match(/PT([\d.]+)M/);
        if (hrMatch)  dur = Math.max(1, Math.round(parseFloat(hrMatch[1]) / 8));
        else if (minMatch) dur = Math.max(1, Math.round(parseFloat(minMatch[1]) / 480));
        else dur = 1;
      }
    }

    // Constraint (MSO=4)
    const constraintType = get(t,'ConstraintType') || '0';
    const constraintDateStr = get(t,'ConstraintDate');
    const constraintDateParsed = parseDateTmp(constraintDateStr);

    // Predecessors: 링크 타입(FS/FF/SS/SF) + Lag 포함
    const predLinkEls = Array.from(t.getElementsByTagNameNS(ns,'PredecessorLink').length
      ? t.getElementsByTagNameNS(ns,'PredecessorLink')
      : t.getElementsByTagName('PredecessorLink'));

    const predIds = predLinkEls
      .map(pl => get(pl,'PredecessorUID'))
      .filter(pu => pu && pu!=='0' && uidMap[pu] && get(uidMap[pu],'Summary')!=='1');

    // WBS — 원본 전체 코드 그대로 보존
    const wbsFull = get(t,'OutlineNumber') || get(t,'WBS') || String(lvl||1);
    const wbs = wbsFull;  // 잘라내지 않고 원본 그대로

    // Original MS Project Task ID (sequential number in project)
    const mppTaskId = get(t,'ID');   // <ID> tag = row number in MSP

    // Generate internal app ID
    const id = 'A' + String(idCounter++).padStart(2,'0');

    // Actual dates from MS Project (ISO format: 2024-01-15T08:00:00)
    const startStr  = get(t,'Start');
    const finishStr = get(t,'Finish');
    const parseDate = s => { if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; };

    // predLinks: "A01:1:0,A02:0:2" 형식
    const predLinksStr = predLinkEls.map(pl => {
      const puid = get(pl,'PredecessorUID');
      if (!puid || puid==='0' || !uidMap[puid] || get(uidMap[puid],'Summary')==='1') return '';
      const mapped = activities.find(a => a._uid === puid);
      if (!mapped) return '';
      const lt   = get(pl,'Type') || '1';
      const lagStr = get(pl,'LinkLag');
      const lag  = lagStr ? Math.round(parseInt(lagStr)/4800) : 0;
      return `${mapped.id}:${lt}:${lag}`;
    }).filter(Boolean).join(',');

    // ── PercentComplete 파싱 ──
    const pctStr = get(t,'PercentComplete') || get(t,'PercentWorkComplete') || get(t,'PhysicalPercentComplete');
    const progress = pctStr ? parseInt(pctStr) : null;

    const act = {
      id, name,
      duration: dur,
      isMilestone,
      predecessors: predIds.map(pu => {
        const mapped = activities.find(a => a._uid === pu);
        return mapped ? mapped.id : '';
      }).filter(Boolean).join(',') || '',
      predLinks: predLinksStr,
      constraintType,
      constraintDate: constraintDateParsed,
      wbs,
      wbsFull,
      mppTaskId,
      progress,
      _uid: uid,
      startDate:  parseDate(startStr),
      finishDate: parseDate(finishStr),
      // MS Project 원본 CP 필드
      mppCritical: get(t,'Critical') === '1',
      mppES:  parseDate(get(t,'EarlyStart')),
      mppEF:  parseDate(get(t,'EarlyFinish')),
      mppLS:  parseDate(get(t,'LateStart')),
      mppLF:  parseDate(get(t,'LateFinish')),
      mppTF:  (() => { const ts=get(t,'TotalSlack'); try{return Math.round(parseInt(ts)/480);}catch{return null;} })(),
      es:null, ef:null, ls:null, lf:null, tf:null, isCritical:false
    };

    // ── Parse task-level ExtendedAttribute values ──
    const taskExtAttrs = Array.from(
      t.getElementsByTagNameNS(ns, 'ExtendedAttribute').length
        ? t.getElementsByTagNameNS(ns, 'ExtendedAttribute')
        : t.getElementsByTagName('ExtendedAttribute')
    );
    const customFields = {};
    taskExtAttrs.forEach(ea => {
      const fid = get(ea, 'FieldID');
      const val = get(ea, 'Value');
      if (fid && val && fieldIdToName[fid]) {
        customFields[fieldIdToName[fid]] = val;
      }
    });
    if (Object.keys(customFields).length > 0) {
      act.customFields = customFields;
    }

    activities.push(act);
    imported++;
  });

  // Second pass: fix predecessors that were added after the activity was created
  activities.forEach(a => {
    const t = uidMap[a._uid];
    if (!t) return;
    const predLinks = Array.from(t.getElementsByTagNameNS(ns,'PredecessorLink').length
      ? t.getElementsByTagNameNS(ns,'PredecessorLink')
      : t.getElementsByTagName('PredecessorLink'));
    const predIds = predLinks
      .map(pl => get(pl,'PredecessorUID'))
      .filter(pu => pu && pu!=='0' && uidMap[pu] && get(uidMap[pu],'Summary')!=='1' && get(uidMap[pu],'Milestone')!=='1');
    a.predecessors = predIds
      .map(pu => { const m = activities.find(x => x._uid===pu); return m?m.id:''; })
      .filter(Boolean).join(',');
  });

  if (imported === 0) { showToast('⚠ 가져올 수 있는 활동이 없습니다. XML 구조를 확인하세요.'); return; }

  renderSidebar();
  showToast(`✓ "${fileName}" 로드 완료 — ${imported}개 활동 (${skipped}개 제외)`);
  document.getElementById('uploadZone').querySelector('.upload-label').innerHTML =
    `✓ <span>${fileName}</span> (${imported}개 활동)`;
}
