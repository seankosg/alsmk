// ─── Toast ────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── Auto Calculate (Debounce) ────────────────────────────────────
let _autoCalc = false;
let _debounceTimer = null;

function toggleAutoCalc() {
  _autoCalc = !_autoCalc;
  const track = document.getElementById('autoCalcToggle');
  const thumb = document.getElementById('autoCalcThumb');
  if (_autoCalc) {
    track.style.background = 'var(--accent)';
    thumb.style.transform = 'translateX(14px)';
    showToast('자동계산 켜짐 — 입력 변경 시 500ms 후 자동 재계산');
  } else {
    track.style.background = 'var(--border)';
    thumb.style.transform = 'translateX(0)';
    showToast('자동계산 꺼짐');
  }
}

function scheduleAutoCalc() {
  if (!_autoCalc) return;
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(() => {
    syncFromDOM();
    calculate();
  }, 500);
}

// ─── Validation ──────────────────────────────────────────────────
function validatePred(inputEl, actId) {
  const val = inputEl.value.trim();
  if (!val) { inputEl.style.borderColor=''; return; }

  const map = {};
  activities.forEach(a => map[a.id] = a);

  const invalid = [];
  val.split(',').forEach(token => {
    const pid = token.trim().split(':')[0].trim();
    if (pid && !map[pid]) invalid.push(pid);
  });

  if (invalid.length) {
    inputEl.style.borderColor = 'var(--critical)';
    inputEl.title = `존재하지 않는 ID: ${invalid.join(', ')}`;
    showToast(`⚠ 선행작업 오류 — 없는 ID: ${invalid.join(', ')}`);
  } else {
    inputEl.style.borderColor = 'var(--green)';
    inputEl.title = '';
    setTimeout(() => { inputEl.style.borderColor=''; }, 1500);
  }
}

// ─── Snapshot Helpers (used by DB snapshot save/restore) ─────────

function _makeSnapshot(name) {
  const reDate = d => d instanceof Date ? d.toISOString() : d;
  return {
    name,
    savedAt: new Date().toISOString(),
    actCount: activities.length,
    cpCount: activities.filter(a=>a.isCritical).length,
    wbsNames: window._wbsNames || {},
    wbsFilter: window._activeWbsFilter ? [...window._activeWbsFilter] : null,
    projStart: window._projStart ? window._projStart.toISOString() : null,
    activities: activities.map(a => ({
      ...a,
      startDate:      reDate(a.startDate),
      finishDate:     reDate(a.finishDate),
      constraintDate: reDate(a.constraintDate),
      mppES: reDate(a.mppES), mppEF: reDate(a.mppEF),
      mppLS: reDate(a.mppLS), mppLF: reDate(a.mppLF),
    }))
  };
}

function _restoreSnapshot(snap) {
  const reDate = s => s ? new Date(s) : null;
  activities = snap.activities.map(a => ({
    ...a,
    startDate:      reDate(a.startDate),
    finishDate:     reDate(a.finishDate),
    constraintDate: reDate(a.constraintDate),
    mppES: reDate(a.mppES), mppEF: reDate(a.mppEF),
    mppLS: reDate(a.mppLS), mppLF: reDate(a.mppLF),
  }));
  idCounter            = Math.max(...activities.map(a=>parseInt(a.id.replace(/\D/g,''))||0)) + 1;
  window._wbsNames     = snap.wbsNames || {};
  window._activeWbsFilter = snap.wbsFilter ? new Set(Array.isArray(snap.wbsFilter) ? snap.wbsFilter : [snap.wbsFilter]) : null;
  window._projStart    = snap.projStart ? new Date(snap.projStart) : null;
}

// ─── Storage ──────────────────────────────────────────────────────
const STORAGE_KEY = 'cpm_network_data';

function saveToStorage() {
  try {
    // Date 객체를 문자열로 변환해서 저장
    const data = {
      activities: activities.map(a => ({
        ...a,
        startDate:      a.startDate      ? a.startDate.toISOString()      : null,
        finishDate:     a.finishDate     ? a.finishDate.toISOString()     : null,
        constraintDate: a.constraintDate ? a.constraintDate.toISOString() : null,
        mppES: a.mppES ? a.mppES.toISOString() : null,
        mppEF: a.mppEF ? a.mppEF.toISOString() : null,
        mppLS: a.mppLS ? a.mppLS.toISOString() : null,
        mppLF: a.mppLF ? a.mppLF.toISOString() : null,
      })),
      idCounter:    idCounter,
      wbsNames:     window._wbsNames || {},
      wbsFilter:    window._activeWbsFilter ? [...window._activeWbsFilter] : null,
      projStart:    window._projStart ? window._projStart.toISOString() : null,
      isSample:     false,
      savedAt:      new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.warn('저장 실패:', e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.activities || !data.activities.length) return false;
    // 샘플 데이터였으면 복원 안 함 (항상 최신 샘플 사용)
    if (data.isSample) return false;

    // Date 문자열 복원
    const reDate = s => s ? new Date(s) : null;
    activities = data.activities.map(a => ({
      ...a,
      startDate:      reDate(a.startDate),
      finishDate:     reDate(a.finishDate),
      constraintDate: reDate(a.constraintDate),
      mppES: reDate(a.mppES), mppEF: reDate(a.mppEF),
      mppLS: reDate(a.mppLS), mppLF: reDate(a.mppLF),
    }));
    idCounter            = data.idCounter || activities.length + 1;
    window._wbsNames     = data.wbsNames || {};
    window._activeWbsFilter = data.wbsFilter || null;
    if (data.projStart)  window._projStart = new Date(data.projStart);

    const saved = new Date(data.savedAt);
    const label = `${saved.getFullYear()}-${String(saved.getMonth()+1).padStart(2,'0')}-${String(saved.getDate()).padStart(2,'0')} ${String(saved.getHours()).padStart(2,'0')}:${String(saved.getMinutes()).padStart(2,'0')}`;
    console.log(`[복원] ${activities.length}개 Activity (저장: ${label})`);
    // 복원 표시는 calculate() 완료 후 saveToStorage()가 갱신
    return true;
  } catch(e) {
    console.warn('복원 실패:', e);
    return false;
  }
}

// ─── Init ─────────────────────────────────────────────────────────
// localStorage에 저장된 데이터가 있으면 복원, 없으면 부모에게 DB 스냅샷 요청
const restored = loadFromStorage();
if (restored) {
  // 복원된 데이터로 계산 재실행
  calculated = false;
  calculate();
} else if (window.parent !== window) {
  // localStorage 없음 → 부모(React)에 DB 스냅샷 요청
  window.parent.postMessage({ type: 'request-db-snapshot' }, '*');
  // DB 응답 올 때까지 샘플 로드 (대기 표시)
  loadSample();
  calculate();
} else {
  // 샘플 데이터 로드 + 계산
  loadSample();
  calculate();
}

// ─── postMessage Bridge ──────────────────────────────────────────
function postCpmCalculated() {
  if (window.parent === window) return;
  const data = activities.map(a => ({
    id: a.id,
    mppTaskId: a.mppTaskId || null,
    mppUid: a._uid || null,
    name: a.name || '',
    duration: a.duration,
    progress: a.progress,
    wbsFull: a.wbsFull || a.wbs || '',
    isCritical: a.isCritical,
    isMilestone: a.isMilestone || false,
    startDate: a.startDate ? fmtDate(a.startDate) : null,
    finishDate: a.finishDate ? fmtDate(a.finishDate) : null,
    es: a.es, ef: a.ef, ls: a.ls, lf: a.lf, tf: a.tf,
    customFields: a.customFields || {}
  }));
  window.parent.postMessage({ type: 'cpm-calculated', activities: data }, '*');
}

// DB 스냅샷 저장 요청 → parent React가 Supabase에 저장
function postSnapshotSave() {
  if (window._readOnly) return;
  if (window.parent === window) return;
  if (!calculated || activities.length === 0) return;
  const snapshot = _makeSnapshot('auto');
  window.parent.postMessage({ type: 'snapshot-save', snapshot }, '*');
}

function handleNodeClick(event, actId, wbsCode) {
  // Shift+click: 네트워크 내 WBS 점프 (기존 동작)
  if (event.shiftKey) {
    jumpToWbs(actId, wbsCode);
    return;
  }
  // 사이드바 카드 선택 + 스크롤
  highlightSidebarCard(actId);

  // 일반 클릭: React 부모에 activity-click 전송
  if (window.parent !== window) {
    const map = {};
    activities.forEach(a => map[a.id] = a);
    const a = map[actId];
    if (a) {
      window.parent.postMessage({
        type: 'activity-click',
        activity: buildActivityPayload(a)
      }, '*');
    }
  } else {
    jumpToWbs(actId, wbsCode);
  }
}

function handleNodeDblClick(event, actId) {
  event.preventDefault();
  if (window.parent === window) return;
  const actMap = {};
  activities.forEach(a => actMap[a.id] = a);
  const a = actMap[actId];
  if (!a) return;
  highlightSidebarCard(actId);

  // Build predecessor details
  const predNames = (a.predecessors||'').split(',').map(s=>s.trim()).filter(Boolean)
    .map(pid => {
      const p = actMap[pid];
      return p ? { id: pid, mppTaskId: p.mppTaskId||null, name: p.name||'', wbs: p.wbsFull||p.wbs||'' } : { id: pid, mppTaskId: null, name: pid, wbs: '' };
    });

  window.parent.postMessage({
    type: 'activity-detail-click',
    activity: {
      ...buildActivityPayload(a),
      predecessors: predNames,
      isPassThrough: !a.isCritical && a.tf === 0
    }
  }, '*');
}

function buildActivityPayload(a) {
  return {
    id: a.id,
    mppTaskId: a.mppTaskId || null,
    mppUid: a._uid || null,
    name: a.name || '',
    duration: a.duration,
    progress: a.progress,
    wbsFull: a.wbsFull || a.wbs || '',
    isCritical: a.isCritical,
    isMilestone: a.isMilestone || false,
    startDate: a.startDate ? fmtDate(a.startDate) : null,
    finishDate: a.finishDate ? fmtDate(a.finishDate) : null,
    es: a.es, ef: a.ef, ls: a.ls, lf: a.lf, tf: a.tf
  };
}

// Listen for messages from parent React app
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  if (e.data.type === 'set-read-only') {
    window._readOnly = !!e.data.readOnly;
    if (window._readOnly) {
      // Hide edit UI elements
      document.querySelectorAll('.upload-zone, .btn-calc, .footer-row, .btn-add').forEach(function(el) {
        el.style.display = 'none';
      });
      // Hide sidebar delete buttons
      document.querySelectorAll('.btn-del').forEach(function(el) {
        el.style.display = 'none';
      });
    }
    return;
  }
  if (e.data.type === 'request-cpm-data') {
    postCpmCalculated();
  }
  if (e.data.type === 'activity-status-update') {
    window._activityStatusMap = {};
    (e.data.statuses || []).forEach(function(s) {
      window._activityStatusMap[s.activityKey] = s;
    });
    // Re-render network if calculated
    if (typeof calculated !== 'undefined' && calculated && typeof order !== 'undefined') {
      drawNetwork(order, map, projectEnd, window._activeWbsFilter || null);
    }
  }
  // Parent requests current snapshot for manual save
  if (e.data.type === 'request-snapshot') {
    if (!calculated || activities.length === 0) return;
    const snap = _makeSnapshot('');
    window.parent.postMessage({ type: 'snapshot-current', snapshot: snap }, '*');
  }
  // DB에서 복원된 스냅샷 수신
  if (e.data.type === 'snapshot-restore') {
    const snap = e.data.snapshot;
    if (!snap || !snap.activities || !snap.activities.length) return;
    // 자동 로드(request-db-snapshot 응답)의 경우 localStorage보다 새로운 경우에만 복원
    // 수동 로드(SnapshotManager)의 경우 항상 복원 (dbUpdatedAt이 현재 시간)
    const forceRestore = e.data.forceRestore === true;
    if (!forceRestore) {
      const localRaw = localStorage.getItem(STORAGE_KEY);
      if (localRaw) {
        try {
          const localData = JSON.parse(localRaw);
          if (localData.savedAt && snap.savedAt && new Date(localData.savedAt) >= new Date(snap.savedAt)) {
            console.log('[CPM Snapshot] localStorage is newer, skipping DB restore');
            return;
          }
        } catch {}
      }
    }
    console.log('[CPM Snapshot] Restoring from DB (' + snap.activities.length + ' activities)');
    _restoreSnapshot(snap);
    calculated = false;
    calculate(true);
    const ind = document.getElementById('saveIndicator');
    if (ind) {
      ind.textContent = '● 서버에서 복원됨';
      ind.style.display = 'inline';
      ind.style.color = 'var(--green)';
    }
  }
});

// ─── Sidebar card highlight helper ───────────────────────────────
function highlightSidebarCard(actId) {
  document.querySelectorAll('.activity-card.selected').forEach(el => el.classList.remove('selected'));
  const selCard = document.querySelector('.activity-card[data-act-id="' + actId + '"]');
  if (selCard) {
    selCard.classList.add('selected');
    selCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// ─── Scroll network canvas to center a node ─────────────────────
function scrollToNode(actId) {
  const p = _nodePositions[actId];
  const canvas = document.getElementById('networkCanvas');
  if (!p || !canvas) return;
  const centerX = p.x + _NODE_W / 2;
  const centerY = p.y + _NODE_H / 2;
  canvas.scrollTo({
    left: centerX - canvas.clientWidth / 2,
    top: centerY - canvas.clientHeight / 2,
    behavior: 'smooth'
  });
  // Flash highlight on the node
  const svgEl = canvas.querySelector('svg');
  if (svgEl) {
    const gNodes = svgEl.querySelectorAll('g[onclick]');
    gNodes.forEach(g => {
      const onclick = g.getAttribute('onclick') || '';
      if (onclick.includes("'" + actId + "'")) {
        const rect = g.querySelector('rect:nth-child(2)');
        if (rect) {
          const origStroke = rect.getAttribute('stroke');
          const origWidth = rect.getAttribute('stroke-width');
          rect.setAttribute('stroke', '#fbbf24');
          rect.setAttribute('stroke-width', '3');
          setTimeout(() => {
            rect.setAttribute('stroke', origStroke || '#2a3347');
            rect.setAttribute('stroke-width', origWidth || '1.5');
          }, 1500);
        }
      }
    });
  }
}

// ─── Sidebar card click → navigate to node + open panel ─────────
function handleSidebarCardClick(actId) {
  // Switch to network tab
  switchTab('network');
  // Scroll to node
  setTimeout(() => scrollToNode(actId), 100);
  // Highlight sidebar card
  highlightSidebarCard(actId);
  // Send activity-click to parent
  if (window.parent !== window) {
    const map = {};
    activities.forEach(a => map[a.id] = a);
    const a = map[actId];
    if (a) {
      window.parent.postMessage({
        type: 'activity-click',
        activity: buildActivityPayload(a)
      }, '*');
    }
  }
}
